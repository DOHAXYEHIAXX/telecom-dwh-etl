[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "telecom-dwh-etl"
version = "1.0.0"
description = "Validated batch ETL pipeline for a telecom transaction data warehouse case study"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Telecom DWH ETL contributors" }]
dependencies = []

[project.scripts]
telecom-etl = "telecom_etl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
